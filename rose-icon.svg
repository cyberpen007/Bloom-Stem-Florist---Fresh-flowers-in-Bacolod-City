<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="200" height="200" fill="#F6F1E7"/>
  
  <g transform="translate(100, 100) rotate(-45)">
    <!-- Stem -->
    <path d="M 0 35 Q -5 55 -2 85" stroke="#2d5016" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Leaves -->
    <ellipse cx="-15" cy="50" rx="8" ry="14" fill="#3d7a1f" transform="rotate(-35 -15 50)"/>
    <ellipse cx="15" cy="60" rx="8" ry="14" fill="#52a141" transform="rotate(35 15 60)"/>
    
    <!-- Rose petals - outer layer -->
    <circle cx="0" cy="-30" r="18" fill="#d32f2f" opacity="0.85"/>
    <circle cx="18" cy="-20" r="16" fill="#d32f2f" opacity="0.8"/>
    <circle cx="28" cy="0" r="15" fill="#d32f2f" opacity="0.75"/>
    <circle cx="18" cy="20" r="16" fill="#d32f2f" opacity="0.8"/>
    <circle cx="0" cy="30" r="18" fill="#d32f2f" opacity="0.85"/>
    <circle cx="-18" cy="20" r="16" fill="#d32f2f" opacity="0.8"/>
    <circle cx="-28" cy="0" r="15" fill="#d32f2f" opacity="0.75"/>
    <circle cx="-18" cy="-20" r="16" fill="#d32f2f" opacity="0.8"/>
    
    <!-- Rose petals - middle layer -->
    <circle cx="0" cy="-15" r="13" fill="#c41c1c" opacity="0.9"/>
    <circle cx="12" cy="-2" r="11" fill="#c41c1c" opacity="0.88"/>
    <circle cx="12" cy="15" r="11" fill="#c41c1c" opacity="0.88"/>
    <circle cx="0" cy="23" r="13" fill="#c41c1c" opacity="0.9"/>
    <circle cx="-12" cy="15" r="11" fill="#c41c1c" opacity="0.88"/>
    <circle cx="-12" cy="-2" r="11" fill="#c41c1c" opacity="0.88"/>
    
    <!-- Rose center -->
    <circle cx="0" cy="4" r="8" fill="#8b0000"/>
  </g>
</svg>