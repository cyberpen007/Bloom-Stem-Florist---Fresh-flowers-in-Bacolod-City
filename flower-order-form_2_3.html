<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloom & Stem — Order Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
  :root{
    --paper:#1A1B16;
    --ink:#EDE8DC;
    --green-deep:#8FA97F;
    --green-mid:#9FB891;
    --mauve:#D9A2AC;
    --blush:#3A2C2E;
    --gold:#D3B571;
    --line:#3C3D34;
    --white:#232420;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:48px 24px 80px;
  }

  .sprig{ display:block; margin:0 auto 8px; }

  header{ text-align:center; margin-bottom:8px; }
  .eyebrow{
    font-size:12px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--green-mid);
    margin:0 0 6px;
    font-weight:500;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:44px;
    margin:0 0 6px;
    color:var(--green-deep);
    letter-spacing:-0.01em;
  }
  .tagline{
    font-style:italic;
    font-family:'Fraunces', serif;
    color:var(--mauve);
    font-size:17px;
    margin:0 0 40px;
  }

  .ticket{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:2px;
    position:relative;
    padding:0;
    box-shadow:0 1px 0 var(--line);
  }
  .ticket::before, .ticket::after{
    content:"";
    position:absolute;
    width:16px; height:16px;
    background:var(--paper);
    border-radius:50%;
    top:50%;
    transform:translateY(-50%);
  }
  .ticket::before{ left:-8px; }
  .ticket::after{ right:-8px; }

  .ticket-top{
    padding:28px 32px 24px;
  }
  .ticket-bottom{
    padding:24px 32px 32px;
  }
  .perforation{
    border-top:1px dashed var(--line);
    margin:0 32px;
  }

  fieldset{
    border:none;
    padding:0;
    margin:0 0 26px;
  }
  legend{
    font-family:'Fraunces', serif;
    font-size:13px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:500;
    padding:0 0 14px;
    width:100%;
    border-bottom:1px solid var(--line);
    margin-bottom:16px;
  }

  .field{ margin-bottom:16px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  label{
    display:block;
    font-size:13px;
    color:var(--green-mid);
    margin-bottom:6px;
    font-weight:500;
  }
  input, select, textarea{
    width:100%;
    font-family:'Work Sans', sans-serif;
    font-size:15px;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:4px;
    padding:10px 12px;
    outline:none;
    transition:border-color .15s ease;
  }
  input:focus, select:focus, textarea:focus{
    border-color:var(--mauve);
  }
  textarea{ resize:vertical; min-height:72px; }

  .radio-group{ display:flex; gap:10px; flex-wrap:wrap; }
  .radio-pill{
    position:relative;
  }
  .radio-pill input{
    position:absolute;
    opacity:0;
    width:100%; height:100%;
    cursor:pointer;
    margin:0;
  }
  .radio-pill span{
    display:inline-block;
    padding:8px 16px;
    border:1px solid var(--line);
    border-radius:20px;
    font-size:14px;
    color:var(--green-deep);
    background:var(--paper);
  }
  .radio-pill input:checked + span{
    background:var(--blush);
    border-color:var(--mauve);
    color:var(--mauve);
  }

  .budget-hint{
    font-size:12px;
    color:#8a8577;
    margin-top:6px;
  }

  button[type=submit]{
    width:100%;
    background:var(--green-deep);
    color:var(--white);
    border:none;
    font-family:'Fraunces', serif;
    font-size:17px;
    font-weight:500;
    padding:15px;
    border-radius:4px;
    cursor:pointer;
    letter-spacing:0.01em;
    transition:background .15s ease;
  }
  button[type=submit]:hover{ background:#7C9A6C; }
  button[type=submit]:active{ transform:scale(0.99); }

  .note{
    text-align:center;
    font-size:12.5px;
    color:#9a9585;
    margin-top:14px;
    line-height:1.5;
  }

  .required{ color:var(--mauve); }

  @media (max-width:480px){
    .row2{ grid-template-columns:1fr; }
    h1{ font-size:34px; }
    .ticket-top, .ticket-bottom{ padding-left:20px; padding-right:20px; }
    .perforation{ margin:0 20px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <svg class="sprig" width="120" height="40" viewBox="0 0 120 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M60 38 C60 24, 60 16, 60 4" stroke="#5C7052" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M60 26 C52 22, 46 24, 40 18" stroke="#5C7052" stroke-width="1.2" stroke-linecap="round" fill="none"/>
      <path d="M60 18 C68 14, 74 16, 80 10" stroke="#5C7052" stroke-width="1.2" stroke-linecap="round" fill="none"/>
      <ellipse cx="38" cy="16" rx="5" ry="2.6" fill="#B4818A" transform="rotate(-25 38 16)"/>
      <ellipse cx="82" cy="8" rx="5" ry="2.6" fill="#B4818A" transform="rotate(20 82 8)"/>
      <circle cx="60" cy="4" r="4" fill="#A9863F"/>
    </svg>
    <p class="eyebrow">Bloom &amp; Stem Florist</p>
    <h1>Submit an Inquiry</h1>
    <p class="tagline">Tell us what you're dreaming of, we'll gather the rest.</p>
  </header>

  <form class="ticket" id="orderForm">
    <div class="ticket-top">

      <fieldset>
        <legend>Your details</legend>
        <div class="row2">
          <div class="field">
            <label for="name">Full name <span class="required">*</span></label>
            <input type="text" id="name" name="name" required>
          </div>
          <div class="field">
            <label for="phone">Phone number <span class="required">*</span></label>
            <input type="tel" id="phone" name="phone" placeholder="09XX XXX XXXX" required>
          </div>
        </div>
        <div class="field">
          <label for="email">Email address <span class="required">*</span></label>
          <input type="email" id="email" name="email" placeholder="name@email.com" required>
        </div>
        <div class="field">
          <label for="orderNumber">Order number</label>
          <input type="text" id="orderNumber" name="orderNumber" placeholder="Enter your order number">
        </div>
        <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
      </fieldset>

      <fieldset>
        <legend>Delivery</legend>
        <div class="field">
          <label for="address">Delivery address <span class="required">*</span></label>
          <textarea id="address" name="address" required></textarea>
        </div>
        <div class="row2">
          <div class="field">
            <label for="date">Delivery date <span class="required">*</span></label>
            <input type="date" id="date" name="date" required>
          </div>
          <div class="field">
            <label for="time">Preferred time</label>
            <select id="time" name="time">
              <option value="Anytime">Anytime</option>
              <option value="Morning (9am-12pm)">Morning (9am–12pm)</option>
              <option value="Afternoon (12pm-4pm)">Afternoon (12pm–4pm)</option>
              <option value="Evening (4pm-7pm)">Evening (4pm–7pm)</option>
            </select>
          </div>
        </div>
      </fieldset>

    </div>

    <div class="perforation"></div>

    <div class="ticket-bottom">

      <fieldset>
        <legend>The arrangement</legend>
        <div class="field">
          <label>Occasion</label>
          <div class="radio-group">
            <label class="radio-pill"><input type="radio" name="occasion" value="Birthday" checked><span>Birthday</span></label>
            <label class="radio-pill"><input type="radio" name="occasion" value="Anniversary"><span>Anniversary</span></label>
            <label class="radio-pill"><input type="radio" name="occasion" value="Sympathy"><span>Sympathy</span></label>
            <label class="radio-pill"><input type="radio" name="occasion" value="Just because"><span>Just because</span></label>
            <label class="radio-pill"><input type="radio" name="occasion" value="Other"><span>Other</span></label>
          </div>
        </div>
        <div class="row2">
          <div class="field">
            <label for="style">Preferred style</label>
            <select id="style" name="style">
              <option>Hand-tied bouquet</option>
              <option>Vase arrangement</option>
              <option>Box arrangement</option>
              <option>Basket</option>
              <option>Not sure — surprise me</option>
            </select>
          </div>
          <div class="field">
            <label for="budget">Budget range</label>
            <select id="budget" name="budget">
              <option>Below ₱800</option>
              <option>₱800 - ₱1,200</option>
              <option>₱1,200 - ₱2,000</option>
              <option>₱2,000 - ₱3,500</option>
              <option>₱3,500+</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="message">Card message</label>
          <textarea id="message" name="message" placeholder="What should the card say?"></textarea>
        </div>
        <div class="field">
          <label for="notes">Anything else we should know?</label>
          <textarea id="notes" name="notes" placeholder="Favorite colors, flowers to avoid, allergies..."></textarea>
        </div>
      </fieldset>

      <button type="submit">Send order to Bloom & Stem</button>
      <p class="note">Your order will be sent directly to Bloom & Stem. We'll get back to you as soon as possible! 🌸</p>
    </div>
  </form>

</div>

<script>
  // EmailJS config — sends the order straight to your inbox, no third-party review step
  const EMAILJS_PUBLIC_KEY = "1RLnWSqQUmSq6QkSm";
  const EMAILJS_SERVICE_ID = "service_6q33ecn";
  const EMAILJS_TEMPLATE_ID = "template_ctsww9t";

  emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY });

  document.getElementById('orderForm').addEventListener('submit', async function(e){
    e.preventDefault();
    const form = e.target;
    const submitBtn = form.querySelector('button[type=submit]');
    const f = new FormData(form);
    const get = k => (f.get(k) || '').toString().trim();

    // Honeypot check — if this hidden field got filled, silently drop the submission
    if (get('_gotcha')) {
      return;
    }

    submitBtn.textContent = 'Sending…';
    submitBtn.disabled = true;

    document.getElementById('form-success') && document.getElementById('form-success').remove();
    document.getElementById('form-error') && document.getElementById('form-error').remove();

    const templateParams = {
      name: get('name'),
      phone: get('phone'),
      email: get('email'),
      orderNumber: get('orderNumber') || '(none provided)',
      deliveryAddress: get('address'),
      deliveryDate: get('date'),
      preferredTime: get('time'),
      occasion: get('occasion'),
      style: get('style'),
      budget: get('budget'),
      cardMessage: get('message') || '(none)',
      notes: get('notes') || '(none)'
    };

    try {
      await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams);

      submitBtn.textContent = 'Send order to Bloom & Stem';
      submitBtn.disabled = false;
      form.reset();
      const msg = document.createElement('div');
      msg.id = 'form-success';
      msg.style.cssText = 'background:#1e3a1a;border:1px solid #4a7a3a;border-radius:8px;padding:16px;text-align:center;margin-top:16px;color:#9BC97A;font-size:14px;line-height:1.6;';
      msg.innerHTML = '✅ <strong>Order sent!</strong><br>We received your order and will get back to you shortly.';
      form.appendChild(msg);
    } catch(err){
      submitBtn.textContent = 'Send order to Bloom & Stem';
      submitBtn.disabled = false;
      const msg = document.createElement('div');
      msg.id = 'form-error';
      msg.style.cssText = 'background:#3a1a1a;border:1px solid #7a3a3a;border-radius:8px;padding:16px;text-align:center;margin-top:16px;color:#e4a0a0;font-size:14px;';
      msg.innerHTML = '❌ Something went wrong. Please try again.';
      form.appendChild(msg);
      console.error('EmailJS error:', err);
    }
  });
</script>

</body>
</html>
